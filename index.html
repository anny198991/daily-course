<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8e4d8">
<title>轻安日课</title>
<style>
:root {
  --ink: #2f3a34;
  --ink-green: #4a5d52;
  --ink-green-deep: #3a4a41;
  --bamboo: #8ba888;
  --bamboo-light: #b5c9b0;
  --ochre: #b07d56;
  --paper: #e8e4d8;
  --paper-warm: #ece8de;
  --card: #faf8f3;
  --text-strong: #2f3a34;
  --text-body: #4a534c;
  --text-soft: #7a847b;
  --text-faint: #a8b0a6;
  --line: rgba(74, 93, 82, 0.12);
  --line-soft: rgba(74, 93, 82, 0.06);
  --font-serif: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--text-body);
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(139, 168, 136, 0.04) 0%, transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(176, 125, 86, 0.03) 0%, transparent 50%);
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* 顶部 */
.top-bar {
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 28px 20px;
  flex-shrink: 0;
}
.greet-main {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 600;
  color: var(--text-strong);
  letter-spacing: 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.greet-sub {
  font-size: 13px;
  color: var(--text-soft);
  margin-top: 8px;
  letter-spacing: 3px;
  padding-left: 2px;
}
.seal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 5px;
  background: var(--ochre);
  color: #faf8f3;
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

/* 内容区 */
.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 28px 40px;
}
.content::-webkit-scrollbar { width: 0; }

/* 日期 */
.date-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 8px;
}
.date-text {
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--text-soft);
  letter-spacing: 2px;
}
.count-text {
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--ink-green);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}

/* 打卡表格 */
.check-list {
  display: flex;
  flex-direction: column;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 22px 4px;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}
.check-row:active {
  background: rgba(74, 93, 82, 0.03);
}
.check-row:last-child {
  border-bottom: none;
}

/* 单字 */
.glyph {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 600;
  color: var(--ink-green-deep);
  width: 40px;
  text-align: center;
  flex-shrink: 0;
  letter-spacing: 0;
  line-height: 1;
  transition: color 0.3s;
}
.check-row.done .glyph {
  color: var(--bamboo);
}

/* 分隔竖线 */
.glyph-divider {
  width: 1px;
  height: 28px;
  background: var(--line);
  flex-shrink: 0;
}

/* 四字标题 */
.title {
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 500;
  color: var(--text-strong);
  letter-spacing: 3px;
  flex: 1;
  transition: color 0.3s;
}
.check-row.done .title {
  color: var(--text-faint);
}

/* 方形勾选框 */
.checkbox {
  width: 26px;
  height: 26px;
  border: 1.8px solid var(--bamboo);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  font-size: 16px;
  transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  background: transparent;
}
.check-row.done .checkbox {
  background: var(--ink-green);
  border-color: var(--ink-green);
  color: #faf8f3;
  transform: scale(0.92);
}

/* 悬浮备注 */
.tooltip {
  position: absolute;
  left: 60px;
  right: auto;
  top: 50%;
  transform: translateY(-50%) translateX(-4px);
  margin-left: 4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.6;
  max-width: 220px;
  box-shadow: 0 4px 16px rgba(58, 74, 65, 0.1);
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  font-family: var(--font-sans);
  letter-spacing: 0.5px;
}
.check-row:hover .tooltip,
.check-row.show-tooltip .tooltip {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* 底部箴言 */
.footnote {
  margin-top: 40px;
  padding: 24px 4px;
  border-top: 1px solid var(--line-soft);
  text-align: center;
}
.footnote-text {
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--text-faint);
  letter-spacing: 4px;
  line-height: 2;
}
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div class="greet-main">
      <span class="seal">課</span>
      轻安日课
    </div>
    <div class="greet-sub">每日有常，慢慢来</div>
  </div>

  <div class="content">

    <div class="date-row">
      <span class="date-text" id="dateText"></span>
      <span class="count-text" id="countText"></span>
    </div>

    <div class="check-list" id="checkList"></div>

    <div class="footnote">
      <div class="footnote-text">
        守住基础即为达标<br>
        不必求全，慢慢来
      </div>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
