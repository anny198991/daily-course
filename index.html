<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8e4d8">
<title>轻安日课</title>
<style>
:root {
  --ink: #2f3a34;
  --ink-green: #4a5d52;
  --ink-green-deep: #3a4a41;
  --bamboo: #8ba888;
  --bamboo-light: #b5c9b0;
  --ochre: #b07d56;
  --paper: #e8e4d8;
  --paper-warm: #ece8de;
  --card: #faf8f3;
  --text-strong: #2f3a34;
  --text-body: #4a534c;
  --text-soft: #7a847b;
  --text-faint: #a8b0a6;
  --line: rgba(74, 93, 82, 0.12);
  --line-soft: rgba(74, 93, 82, 0.06);
  --font-serif: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--paper);
  color: var(--text-body);
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(139, 168, 136, 0.04) 0%, transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(176, 125, 86, 0.03) 0%, transparent 50%),
    repeating-linear-gradient(0deg,
      rgba(74, 93, 82, 0.018) 0px,
      rgba(74, 93, 82, 0.018) 1px,
      transparent 1px,
      transparent 38px);
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* 顶部 */
.top-bar {
  padding: calc(env(safe-area-inset-top, 0px) + 28px) 28px 18px;
  flex-shrink: 0;
}
.greet-main {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 600;
  color: var(--text-strong);
  letter-spacing: 5px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.greet-sub {
  font-size: 12px;
  color: var(--text-soft);
  margin-top: 10px;
  letter-spacing: 4px;
  padding-left: 2px;
  opacity: 0.8;
}
.seal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  border-radius: 4px;
  background: var(--ochre);
  color: #faf8f3;
  font-family: var(--font-serif);
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0;
  box-shadow: 0 1px 3px rgba(176, 125, 86, 0.25);
}

/* 内容区 — 左右分栏 */
.content {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* 左列导航 */
.left-rail {
  flex-shrink: 0;
  width: 56px;
  display: flex;
  flex-direction: column;
  background: rgba(74, 93, 82, 0.03);
  border-right: 1px solid var(--line-soft);
  padding-top: 4px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.left-rail::-webkit-scrollbar { width: 0; }

.rail-item {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 4px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid var(--line-soft);
}
.rail-item:active {
  background: rgba(74, 93, 82, 0.06);
}
.rail-item.active {
  background: var(--ink-green);
}
.rail-num {
  font-family: var(--font-serif);
  font-size: 10px;
  color: var(--text-faint);
  opacity: 0.6;
  line-height: 1;
  margin-bottom: 4px;
}
.rail-glyph {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  color: var(--ink-green-deep);
  line-height: 1;
}
.rail-item.active .rail-num {
  color: rgba(255,255,255,0.6);
  opacity: 1;
}
.rail-item.active .rail-glyph {
  color: #faf8f3;
}
.rail-item.done .rail-glyph {
  color: var(--bamboo);
}

/* 右列内容 */
.right-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 16px 40px;
  scroll-behavior: smooth;
}
.right-content::-webkit-scrollbar { width: 0; }

/* 日期 */
.date-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px 16px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 12px;
}
.date-text {
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--text-soft);
  letter-spacing: 2px;
}
.count-text {
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--ink-green);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}

/* 日课卡片 */
.course-card {
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  padding: 16px 16px 14px;
  margin-bottom: 10px;
  transition: border-color 0.2s, opacity 0.3s;
}
.course-card.done {
  opacity: 0.65;
}
.course-card.done .card-title {
  color: var(--text-faint);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.card-glyph {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink-green-deep);
  flex-shrink: 0;
  line-height: 1;
}
.card-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 500;
  color: var(--text-strong);
  letter-spacing: 3px;
  flex: 1;
  transition: color 0.3s;
}
.card-checkbox {
  width: 26px;
  height: 26px;
  border: 1.8px solid var(--bamboo);
  border-radius: 5px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  background: transparent;
}
.course-card.done .card-checkbox {
  background: var(--ink-green);
  border-color: var(--ink-green);
  color: #faf8f3;
  transform: scale(0.92);
}

/* 卡片操作行 */
.card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.card-time-tag {
  font-family: var(--font-serif);
  font-size: 12px;
  color: var(--text-faint);
  letter-spacing: 1px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.3;
}
.card-time-tag:active {
  background: rgba(74, 93, 82, 0.06);
}
.card-time-tag.has-time {
  color: var(--ink-green);
  border-color: rgba(74, 93, 82, 0.2);
  background: rgba(74, 93, 82, 0.04);
}
.card-action-btn {
  font-family: var(--font-serif);
  font-size: 12px;
  color: var(--ochre);
  letter-spacing: 1px;
  padding: 4px 10px;
  border: 1px solid rgba(176, 125, 86, 0.3);
  border-radius: 6px;
  background: rgba(176, 125, 86, 0.04);
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.3;
}
.card-action-btn:active {
  background: rgba(176, 125, 86, 0.12);
}
.card-action-btn.filled {
  background: var(--ochre);
  color: #faf8f3;
  border-color: var(--ochre);
}

/* 卡片内容区（原 tooltip 内容平铺）*/
.card-body {
  font-family: var(--font-sans);
  font-size: 12.5px;
  color: var(--text-soft);
  line-height: 1.7;
  letter-spacing: 0.3px;
}
.card-body .tp-note {
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--text-body);
  letter-spacing: 1px;
  line-height: 1.6;
  padding-bottom: 2px;
}
.card-body .tp-section {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--line-soft);
}
.card-body .tp-label {
  font-family: var(--font-serif);
  font-size: 12px;
  color: var(--ink-green);
  letter-spacing: 2px;
  margin-bottom: 5px;
  font-weight: 500;
}
.card-body .tp-item {
  font-size: 12px;
  color: var(--text-body);
  line-height: 1.6;
  margin-bottom: 5px;
}
.card-body .tp-hint {
  display: block;
  font-size: 11px;
  color: var(--text-faint);
  line-height: 1.5;
  margin-top: 1px;
}
.card-body .tp-rule {
  font-size: 11px;
  color: var(--text-soft);
  line-height: 1.6;
  margin-top: 6px;
  padding: 5px 8px;
  background: rgba(74, 93, 82, 0.04);
  border-radius: 6px;
  border-left: 2px solid var(--bamboo-light);
}
.card-body .tp-link {
  display: block;
  font-family: monospace;
  font-size: 10.5px;
  color: var(--ochre);
  line-height: 1.5;
  margin-top: 2px;
  word-break: break-all;
  letter-spacing: 0;
  opacity: 0.75;
  user-select: all;
  -webkit-user-select: all;
}

/* 底部时间选择器 */
.time-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(47, 58, 52, 0.35);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.time-sheet-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}
.time-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  z-index: 101;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  padding: 8px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  box-shadow: 0 -4px 24px rgba(58, 74, 65, 0.12);
  max-height: 65vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.time-sheet.show {
  transform: translateY(0);
}
.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 4px 12px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 4px;
}
.sheet-title {
  font-family: var(--font-serif);
  font-size: 16px;
  color: var(--text-strong);
  letter-spacing: 3px;
}
.sheet-clear {
  font-size: 13px;
  color: var(--text-soft);
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.sheet-clear:active { background: rgba(74, 93, 82, 0.06); }

.time-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  transition: background 0.15s;
}
.time-option:active { background: rgba(74, 93, 82, 0.04); }
.time-option:last-child { border-bottom: none; }
.time-option .opt-epoch {
  font-family: var(--font-serif);
  font-size: 18px;
  color: var(--text-strong);
  letter-spacing: 2px;
}
.time-option .opt-range {
  font-size: 13px;
  color: var(--text-soft);
  font-variant-numeric: tabular-nums;
}
.time-option.selected .opt-epoch { color: var(--ink-green); }
.time-option.selected .opt-range { color: var(--ink-green); }
.time-option .opt-check {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-green);
  font-size: 16px;
  opacity: 0;
  transition: opacity 0.2s;
}
.time-option.selected .opt-check { opacity: 1; }

/* 复盘表单 */
.review-sheet {
  max-height: 80vh;
}
.review-form {
  padding: 4px 4px 8px;
}
.review-field {
  margin-bottom: 14px;
}
.review-field:last-child {
  margin-bottom: 4px;
}
.review-label {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--text-strong);
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.review-sub {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0;
  font-weight: normal;
}
.review-input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--font-sans);
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.6;
  background: rgba(250, 248, 243, 0.6);
  resize: none;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  -webkit-appearance: none;
}
.review-input:focus {
  border-color: var(--bamboo);
  background: var(--card);
}
.review-input::placeholder {
  color: var(--text-faint);
  opacity: 0.6;
}

/* 运动选择 - 其他输入框 */
.sport-other-box {
  padding: 12px 4px 4px;
}
.sport-other-input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text-body);
  background: rgba(250, 248, 243, 0.6);
  outline: none;
  -webkit-appearance: none;
}
.sport-other-input:focus {
  border-color: var(--bamboo);
  background: var(--card);
}
.sport-other-input::placeholder {
  color: var(--text-faint);
  opacity: 0.6;
}

/* 底部箴言 */
.footnote {
  margin-top: 40px;
  padding: 24px 4px;
  border-top: 1px solid var(--line-soft);
  text-align: center;
}
.footnote-text {
  font-family: var(--font-serif);
  font-size: 13px;
  color: var(--text-faint);
  letter-spacing: 4px;
  line-height: 2;
}
.footnote-rule {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--text-faint);
  opacity: 0.7;
  line-height: 1.8;
  letter-spacing: 0.5px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
}
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div class="greet-main">
      <span class="seal">課</span>
      轻安日课
    </div>
    <div class="greet-sub">每日有常，慢慢来</div>
  </div>

  <div class="content">

    <!-- 左列导航 -->
    <div class="left-rail" id="leftRail"></div>

    <!-- 右列内容 -->
    <div class="right-content" id="rightContent">

      <div class="date-row">
        <span class="date-text" id="dateText"></span>
        <span class="count-text" id="countText"></span>
      </div>

      <div id="cardList"></div>

      <div class="footnote">
        <div class="footnote-text">
          守住基础即为达标<br>
          不必求全，慢慢来
        </div>
        <div class="footnote-rule">
          陪护母亲、身心极度劳累特殊日期：<br>
          息·调心守静、静·澄怀观己 两项可直接跳过<br>
          接纳状态波动，不以打卡自我施压
        </div>
      </div>

    </div>

  </div>

</div>

<!-- 底部时间选择器 -->
<div class="time-sheet-backdrop" id="sheetBackdrop"></div>
<div class="time-sheet" id="timeSheet">
  <div class="sheet-header">
    <span class="sheet-title" id="sheetTitle">选择时段</span>
    <span class="sheet-clear" id="sheetClear">清除</span>
  </div>
  <div id="timeOptions"></div>
</div>

<!-- 底部复盘表单（c6 专用）-->
<div class="time-sheet-backdrop" id="reviewBackdrop"></div>
<div class="time-sheet review-sheet" id="reviewSheet">
  <div class="sheet-header">
    <span class="sheet-title">作 · 一事闭环 · KPT复盘</span>
    <span class="sheet-clear" id="reviewSave">保存</span>
  </div>
  <div class="review-form">
    <div class="review-field">
      <label class="review-label">今日核心做的一件事</label>
      <textarea class="review-input" id="revThing" rows="2" placeholder="今天最重要的那件事…"></textarea>
    </div>
    <div class="review-field">
      <label class="review-label">K · Keep<span class="review-sub">做得好的，下次保持</span></label>
      <textarea class="review-input" id="revKeep" rows="3" placeholder="哪里做得好，值得保持的…"></textarea>
    </div>
    <div class="review-field">
      <label class="review-label">P · Problem<span class="review-sub">卡在哪，结果与预期差距</span></label>
      <textarea class="review-input" id="revProblem" rows="3" placeholder="遇到什么问题，卡在哪里…"></textarea>
    </div>
    <div class="review-field">
      <label class="review-label">T · Try<span class="review-sub">下次尝试什么新做法</span></label>
      <textarea class="review-input" id="revTry" rows="3" placeholder="下次想试什么…"></textarea>
    </div>
  </div>
</div>

<!-- 底部运动选择（c7 专用）-->
<div class="time-sheet-backdrop" id="sportBackdrop"></div>
<div class="time-sheet" id="sportSheet">
  <div class="sheet-header">
    <span class="sheet-title">动 · 舒体养身 · 选项目</span>
    <span class="sheet-clear" id="sportSave">保存</span>
  </div>
  <div id="sportOptions"></div>
  <div class="sport-other-box" id="sportOtherBox" style="display:none;">
    <input type="text" class="sport-other-input" id="sportOtherInput" placeholder="填写其他运动项目…">
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
